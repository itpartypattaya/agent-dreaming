name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check dreamem tests
      - run: python -m pytest -q -p no:cacheprovider

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install it into a clean environment
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && DREAMEM_HOME=/tmp/dh CLAUDE_CONFIG_DIR=/tmp/none CODEX_HOME=/tmp/none HOLOMEM_HOME=/tmp/none \
            /tmp/clean/bin/dreamem run --dry-run
          /tmp/clean/bin/python -c "import dreamem.engineapi as e; assert (e.ENGINE_DIR / 'dream.py').exists()"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict claude-plugin
      - run: claude plugin validate --strict .
