<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- phase frames -->
  <rect x="20" y="148" width="1000" height="122" rx="6" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="20" y="148" width="250" height="18" rx="4" fill="rgba(6,78,59,0.8)" stroke="#34d399" stroke-width="1"/>
  <text x="145" y="161" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">NIGHT · first session after dream_time</text>

  <rect x="20" y="290" width="1000" height="460" rx="6" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="20" y="290" width="250" height="18" rx="4" fill="rgba(120,53,15,0.8)" stroke="#fbbf24" stroke-width="1"/>
  <text x="145" y="303" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">NEXT SESSION · the review</text>

  <!-- lifelines -->
  <line x1="90" y1="124" x2="90" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="260" y1="124" x2="260" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="430" y1="124" x2="430" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="600" y1="124" x2="600" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="770" y1="124" x2="770" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="940" y1="124" x2="940" y2="740" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- NIGHT -->
  <line x1="430" y1="195" x2="598" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-open)"/>
  <text x="515" y="187" fill="#e2e8f0" font-size="9" text-anchor="middle">run --if-due (background)</text>
  <line x1="600" y1="225" x2="938" y2="225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="217" fill="#e2e8f0" font-size="9" text-anchor="middle">read facts, versions, journal · read-only</text>
  <line x1="600" y1="255" x2="768" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="685" y="247" fill="#e2e8f0" font-size="9" text-anchor="middle">questions · summary</text>

  <!-- NEXT SESSION -->
  <line x1="430" y1="335" x2="768" y2="335" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="327" fill="#e2e8f0" font-size="9" text-anchor="middle">read summary (counts only)</text>
  <line x1="430" y1="370" x2="262" y2="370" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="345" y="362" fill="#94a3b8" font-size="9" font-style="italic" text-anchor="middle">“3 memory questions wait”</text>
  <line x1="90" y1="405" x2="258" y2="405" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="175" y="397" fill="#60a5fa" font-size="9" text-anchor="middle">/agent-dreaming:dream</text>
  <line x1="260" y1="440" x2="598" y2="440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="432" fill="#e2e8f0" font-size="9" text-anchor="middle">dreamem show</text>
  <line x1="600" y1="470" x2="262" y2="470" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="430" y="462" fill="#94a3b8" font-size="9" font-style="italic" text-anchor="middle">open questions, texts re-read now</text>
  <line x1="260" y1="505" x2="92" y2="505" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="497" fill="#e2e8f0" font-size="9" text-anchor="middle">“Still true: …?”</text>
  <line x1="90" y1="540" x2="258" y2="540" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="175" y="532" fill="#60a5fa" font-size="9" text-anchor="middle">“outdated”</text>
  <line x1="260" y1="575" x2="598" y2="575" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="567" fill="#e2e8f0" font-size="9" text-anchor="middle">dreamem decide Q3-7f2a outdated</text>
  <line x1="600" y1="605" x2="262" y2="605" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="430" y="597" fill="#94a3b8" font-size="9" font-style="italic" text-anchor="middle">call: memory_end {fact, expect}</text>
  <line x1="260" y1="640" x2="938" y2="640" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="632" fill="#e2e8f0" font-size="9" text-anchor="middle">memory_stats · is it the same store?</text>
  <line x1="260" y1="675" x2="938" y2="675" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="600" y="667" fill="#fb7185" font-size="9" text-anchor="middle">memory_end · refused if the fact changed since the night</text>
  <line x1="260" y1="715" x2="598" y2="715" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="707" fill="#e2e8f0" font-size="9" text-anchor="middle">applied Q3-7f2a · or failed → asked again</text>

  <!-- numbering -->
  <g font-size="7" font-weight="600" text-anchor="middle">
    <circle cx="415" cy="195" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="415" y="198" fill="#60a5fa">1</text>
    <circle cx="585" cy="225" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="585" y="228" fill="#60a5fa">2</text>
    <circle cx="585" cy="255" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="585" y="258" fill="#60a5fa">3</text>
    <circle cx="415" cy="335" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="415" y="338" fill="#60a5fa">4</text>
    <circle cx="445" cy="370" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="445" y="373" fill="#60a5fa">5</text>
    <circle cx="75" cy="405" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="75" y="408" fill="#60a5fa">6</text>
    <circle cx="245" cy="440" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="245" y="443" fill="#60a5fa">7</text>
    <circle cx="615" cy="470" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="615" y="473" fill="#60a5fa">8</text>
    <circle cx="275" cy="505" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="275" y="508" fill="#60a5fa">9</text>
    <circle cx="75" cy="540" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="75" y="543" fill="#60a5fa">10</text>
    <circle cx="245" cy="575" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="245" y="578" fill="#60a5fa">11</text>
    <circle cx="615" cy="605" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="615" y="608" fill="#60a5fa">12</text>
    <circle cx="245" cy="640" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="245" y="643" fill="#60a5fa">13</text>
    <circle cx="245" cy="675" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="245" y="678" fill="#60a5fa">14</text>
    <circle cx="245" cy="715" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="245" y="718" fill="#60a5fa">15</text>
  </g>

  <!-- actors -->
  <rect x="25" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="25" y="80" width="130" height="44" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="90" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">You</text>

  <rect x="195" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="195" y="80" width="130" height="44" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="260" y="100" fill="white" font-size="11" font-weight="600" text-anchor="middle">Agent</text>
  <text x="260" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">review skill</text>

  <rect x="365" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="365" y="80" width="130" height="44" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="430" y="100" fill="white" font-size="11" font-weight="600" text-anchor="middle">Hooks</text>
  <text x="430" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">SessionStart</text>

  <rect x="535" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="535" y="80" width="130" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">dreamem</text>

  <rect x="705" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="705" y="80" width="130" height="44" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="770" y="107" fill="white" font-size="11" font-weight="600" text-anchor="middle">~/.dreaming</text>

  <rect x="875" y="80" width="130" height="44" rx="6" fill="#0f172a"/>
  <rect x="875" y="80" width="130" height="44" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="940" y="100" fill="white" font-size="11" font-weight="600" text-anchor="middle">holographic</text>
  <text x="940" y="114" fill="#94a3b8" font-size="8" text-anchor="middle">memory store</text>

  <text x="25" y="34" fill="white" font-size="16" font-weight="700">A night and a review</text>
  <text x="25" y="50" fill="#94a3b8" font-size="9">nothing in memory changes until step 14, and only with your answer</text>

  <text x="25" y="772" fill="#64748b" font-size="8">solid: call · dashed: reply · open head: runs in the background · blue: your words · rose: the one write</text>
</svg>
