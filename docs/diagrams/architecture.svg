<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. regions -->
  <rect x="30" y="80" width="230" height="410" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="42" y="97" fill="#22d3ee" font-size="9" font-weight="600">READS · read-only</text>

  <rect x="300" y="80" width="250" height="410" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="312" y="97" fill="#34d399" font-size="9" font-weight="600">dreamem run · the pass</text>
  <text x="312" y="476" fill="#64748b" font-size="8">no model · no network · seconds</text>

  <rect x="590" y="80" width="210" height="410" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="602" y="97" fill="#a78bfa" font-size="9" font-weight="600">~/.dreaming · the only write</text>

  <rect x="840" y="80" width="230" height="410" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="852" y="97" fill="#fbbf24" font-size="9" font-weight="600">IN A SESSION</text>

  <!-- 3. connections -->
  <!-- reads / writes between regions -->
  <line x1="262" y1="285" x2="297" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="277" fill="#94a3b8" font-size="8" text-anchor="middle">reads</text>
  <line x1="552" y1="285" x2="587" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="277" fill="#94a3b8" font-size="8" text-anchor="middle">writes</text>
  <!-- pass steps -->
  <line x1="425" y1="170" x2="425" y2="188" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="425" y1="250" x2="425" y2="268" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="425" y1="330" x2="425" y2="348" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <!-- store -> session -->
  <line x1="785" y1="138" x2="857" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="821" y="130" fill="#94a3b8" font-size="8" text-anchor="middle">counts</text>
  <path d="M 785,213 L 820,213 L 820,228 L 857,228" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">show</text>
  <!-- session chain -->
  <line x1="955" y1="170" x2="955" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="955" y1="260" x2="955" y2="288" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="963" y="279" fill="#94a3b8" font-size="8">asks · one at a time</text>
  <line x1="955" y1="350" x2="955" y2="378" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="963" y="369" fill="#fb7185" font-size="8">your answer</text>
  <!-- background pass started by the hook -->
  <path d="M 955,108 L 955,66 L 425,66 L 425,108" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-emerald)"/>
  <text x="690" y="60" fill="#34d399" font-size="8" text-anchor="middle">background at session start: dreamem run --if-due</text>
  <!-- the only way back into memory -->
  <path d="M 955,440 L 955,545 L 145,545 L 145,458" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="550" y="562" fill="#fb7185" font-size="9" text-anchor="middle">memory changes only here: your agent, your answer, the version you saw (expect)</text>

  <!-- 4+5+6. components: READS -->
  <rect x="50" y="110" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="50" y="110" width="190" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">Claude Code transcripts</text>
  <text x="145" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">~/.claude/projects/*/*.jsonl</text>

  <rect x="50" y="190" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="50" y="190" width="190" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="214" fill="white" font-size="11" font-weight="600" text-anchor="middle">Codex sessions</text>
  <text x="145" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">~/.codex/sessions/** (.zst)</text>

  <rect x="50" y="270" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="50" y="270" width="190" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="294" fill="white" font-size="11" font-weight="600" text-anchor="middle">Memory notes</text>
  <text x="145" y="310" fill="#94a3b8" font-size="9" text-anchor="middle">memory/*.md · CLAUDE.md</text>

  <g transform="translate(55, 362)">
    <rect x="0" y="12" width="180" height="70" rx="2" fill="#0f172a"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="#0f172a"/>
    <ellipse cx="90" cy="82" rx="90" ry="12" fill="#0f172a"/>
    <rect x="0" y="12" width="180" height="70" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="90" cy="82" rx="90" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="0" y="12" width="180" height="70" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="82" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="180" y1="12" x2="180" y2="82" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="90" y="46" fill="white" font-size="11" font-weight="600" text-anchor="middle">holographic-memory</text>
    <text x="90" y="62" fill="#94a3b8" font-size="9" text-anchor="middle">facts · versions · journal</text>
  </g>

  <!-- the pass -->
  <rect x="320" y="110" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="320" y="110" width="210" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">1 · Read</text>
  <text x="425" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">your words only, cached offsets</text>

  <rect x="320" y="190" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="320" y="190" width="210" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="214" fill="white" font-size="11" font-weight="600" text-anchor="middle">2 · Screen</text>
  <text x="425" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">secrets, instructions dropped</text>

  <rect x="320" y="270" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="320" y="270" width="210" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="294" fill="white" font-size="11" font-weight="600" text-anchor="middle">3 · Compare</text>
  <text x="425" y="310" fill="#94a3b8" font-size="9" text-anchor="middle">dupes · conflicts · decay</text>

  <rect x="320" y="350" width="210" height="60" rx="6" fill="#0f172a"/>
  <rect x="320" y="350" width="210" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="374" fill="white" font-size="11" font-weight="600" text-anchor="middle">4 · Ask</text>
  <text x="425" y="390" fill="#94a3b8" font-size="9" text-anchor="middle">≤7 questions · ≤10 new-fact leads</text>

  <!-- ~/.dreaming -->
  <rect x="605" y="110" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="605" y="110" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="133" fill="white" font-size="11" font-weight="600" text-anchor="middle">summary.json</text>
  <text x="695" y="149" fill="#94a3b8" font-size="9" text-anchor="middle">counts, no fact text</text>

  <rect x="605" y="185" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="605" y="185" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="208" fill="white" font-size="11" font-weight="600" text-anchor="middle">questions.json</text>
  <text x="695" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">+ report.md, per profile</text>

  <rect x="605" y="260" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="605" y="260" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="283" fill="white" font-size="11" font-weight="600" text-anchor="middle">claude-lines.json</text>
  <text x="695" y="299" fill="#94a3b8" font-size="9" text-anchor="middle">where your lines are</text>

  <rect x="605" y="335" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="605" y="335" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="358" fill="white" font-size="11" font-weight="600" text-anchor="middle">salt · candidates</text>
  <text x="695" y="374" fill="#94a3b8" font-size="9" text-anchor="middle">keyed digests, no words</text>

  <rect x="605" y="410" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="605" y="410" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="695" y="433" fill="white" font-size="11" font-weight="600" text-anchor="middle">state/</text>
  <text x="695" y="449" fill="#94a3b8" font-size="9" text-anchor="middle">rejects · answered events</text>

  <!-- session -->
  <rect x="860" y="110" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="860" y="110" width="190" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="955" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">SessionStart hooks</text>
  <text x="955" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">one line: “3 questions wait”</text>

  <rect x="860" y="200" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="860" y="200" width="190" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="955" y="224" fill="white" font-size="11" font-weight="600" text-anchor="middle">Review skill</text>
  <text x="955" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">/agent-dreaming:dream</text>

  <rect x="860" y="290" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="860" y="290" width="190" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="955" y="314" fill="white" font-size="11" font-weight="600" text-anchor="middle">You</text>
  <text x="955" y="330" fill="#94a3b8" font-size="9" text-anchor="middle">yes · no · later · …</text>

  <rect x="860" y="380" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="860" y="380" width="190" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="955" y="404" fill="white" font-size="11" font-weight="600" text-anchor="middle">memory_* tools</text>
  <text x="955" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">the call dreamem printed</text>

  <!-- 8. title -->
  <text x="30" y="34" fill="white" font-size="16" font-weight="700">agent-dreaming · architecture</text>
  <text x="30" y="50" fill="#94a3b8" font-size="9">Claude Code + Codex CLI · reads everywhere, writes only to ~/.dreaming</text>

  <!-- legend -->
  <rect x="30" y="582" width="10" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="46" y="591" fill="#94a3b8" font-size="8">inputs</text>
  <rect x="110" y="582" width="10" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="126" y="591" fill="#94a3b8" font-size="8">deterministic pass</text>
  <rect x="240" y="582" width="10" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="256" y="591" fill="#94a3b8" font-size="8">storage</text>
  <rect x="320" y="582" width="10" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/>
  <text x="336" y="591" fill="#94a3b8" font-size="8">agent session</text>
  <rect x="430" y="582" width="10" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="446" y="591" fill="#94a3b8" font-size="8">writes to memory</text>
</svg>
