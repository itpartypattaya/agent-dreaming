<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- regions -->
  <rect x="25" y="80" width="1060" height="130" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="37" y="97" fill="#34d399" font-size="9" font-weight="600">NIGHT · dreamem run · no words kept</text>

  <rect x="25" y="265" width="1060" height="235" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="37" y="282" fill="#fbbf24" font-size="9" font-weight="600">REVIEW · in a session</text>

  <!-- arrows: night row -->
  <line x1="210" y1="145" x2="248" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="145" x2="488" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="145" x2="698" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="145" x2="928" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- night to review -->
  <path d="M 1005,196 L 1005,238 L 160,238 L 160,298" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="232" fill="#94a3b8" font-size="8" text-anchor="middle">up to 10 per night, newest first · outside the 7-question budget</text>

  <!-- arrows: review row -->
  <line x1="200" y1="335" x2="213" y2="335" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="335" x2="353" y2="335" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="339" y="327" fill="#34d399" font-size="8" text-anchor="middle">yes</text>
  <line x1="270" y1="373" x2="270" y2="408" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="278" y="395" fill="#fb7185" font-size="8">no</text>
  <line x1="555" y1="335" x2="568" y2="335" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="335" x2="708" y2="335" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="327" fill="#34d399" font-size="8" text-anchor="middle">yes</text>
  <line x1="625" y1="373" x2="625" y2="408" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="633" y="395" fill="#fb7185" font-size="8">no</text>
  <line x1="880" y1="335" x2="918" y2="335" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="899" y="327" fill="#60a5fa" font-size="8" text-anchor="middle">save</text>

  <!-- night row boxes -->
  <rect x="40" y="112" width="170" height="66" rx="6" fill="#0f172a"/>
  <rect x="40" y="112" width="170" height="66" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="125" y="138" fill="white" font-size="11" font-weight="600" text-anchor="middle">Your messages</text>
  <text x="125" y="154" fill="#94a3b8" font-size="9" text-anchor="middle">the CLIs' own files</text>

  <rect x="250" y="112" width="200" height="66" rx="6" fill="#0f172a"/>
  <rect x="250" y="112" width="200" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">Wide filter</text>
  <text x="350" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">about you or your people</text>
  <text x="350" y="164" fill="#94a3b8" font-size="9" text-anchor="middle">no code, commands, pastes</text>

  <rect x="490" y="112" width="170" height="66" rx="6" fill="#0f172a"/>
  <rect x="490" y="112" width="170" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="575" y="138" fill="white" font-size="11" font-weight="600" text-anchor="middle">Not in memory</text>
  <text x="575" y="154" fill="#94a3b8" font-size="9" text-anchor="middle">by its words</text>

  <rect x="700" y="112" width="190" height="66" rx="6" fill="#0f172a"/>
  <rect x="700" y="112" width="190" height="66" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="795" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">A reference</text>
  <text x="795" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">session · HMAC(message)</text>
  <text x="795" y="164" fill="#94a3b8" font-size="9" text-anchor="middle">HMAC(clause) · days</text>

  <g transform="translate(930, 108)">
    <rect x="0" y="10" width="150" height="66" rx="2" fill="#0f172a"/>
    <ellipse cx="75" cy="10" rx="75" ry="10" fill="#0f172a"/>
    <ellipse cx="75" cy="76" rx="75" ry="10" fill="#0f172a"/>
    <rect x="0" y="10" width="150" height="66" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="75" cy="76" rx="75" ry="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="0" y="10" width="150" height="66" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="75" cy="10" rx="75" ry="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="75" y="42" fill="white" font-size="11" font-weight="600" text-anchor="middle">~/.dreaming</text>
    <text x="75" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">digests only</text>
  </g>

  <!-- review row -->
  <rect x="40" y="300" width="160" height="70" rx="6" fill="#0f172a"/>
  <rect x="40" y="300" width="160" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="120" y="326" fill="white" font-size="11" font-weight="600" text-anchor="middle">Read it again</text>
  <text x="120" y="342" fill="#94a3b8" font-size="9" text-anchor="middle">from the session</text>
  <text x="120" y="356" fill="#94a3b8" font-size="9" text-anchor="middle">file, by reference</text>

  <g transform="translate(270, 335)">
    <polygon points="0,-38 55,0 0,38 -55,0" fill="#0f172a"/>
    <polygon points="0,-38 55,0 0,38 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" fill="white" font-size="10" font-weight="600" text-anchor="middle">digests</text>
    <text y="12" fill="white" font-size="10" font-weight="600" text-anchor="middle">match?</text>
  </g>

  <rect x="205" y="410" width="130" height="56" rx="6" fill="#0f172a"/>
  <rect x="205" y="410" width="130" height="56" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="270" y="433" fill="white" font-size="11" font-weight="600" text-anchor="middle">Gone</text>
  <text x="270" y="449" fill="#94a3b8" font-size="9" text-anchor="middle">never shown</text>

  <rect x="355" y="300" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="355" y="300" width="200" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="455" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">Agent judges</text>
  <text x="455" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">lasting · yours · new</text>
  <text x="455" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">memory_search first</text>

  <g transform="translate(625, 335)">
    <polygon points="0,-38 55,0 0,38 -55,0" fill="#0f172a"/>
    <polygon points="0,-38 55,0 0,38 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" fill="white" font-size="10" font-weight="600" text-anchor="middle">a real</text>
    <text y="12" fill="white" font-size="10" font-weight="600" text-anchor="middle">fact?</text>
  </g>

  <rect x="560" y="410" width="130" height="56" rx="6" fill="#0f172a"/>
  <rect x="560" y="410" width="130" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="625" y="433" fill="white" font-size="11" font-weight="600" text-anchor="middle">not-a-fact</text>
  <text x="625" y="449" fill="#94a3b8" font-size="9" text-anchor="middle">you never see it</text>

  <rect x="710" y="300" width="170" height="70" rx="6" fill="#0f172a"/>
  <rect x="710" y="300" width="170" height="70" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="795" y="322" fill="white" font-size="11" font-weight="600" text-anchor="middle">You answer</text>
  <text x="795" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">save · no · never</text>
  <text x="795" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">one per review</text>
  <text x="795" y="390" fill="#64748b" font-size="8" text-anchor="middle">“no” rests 30 days</text>
  <text x="795" y="403" fill="#64748b" font-size="8" text-anchor="middle">“never” never returns</text>

  <rect x="920" y="300" width="150" height="70" rx="6" fill="#0f172a"/>
  <rect x="920" y="300" width="150" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="995" y="326" fill="white" font-size="11" font-weight="600" text-anchor="middle">memory_add</text>
  <text x="995" y="342" fill="#94a3b8" font-size="9" text-anchor="middle">one short sentence</text>
  <text x="995" y="356" fill="#94a3b8" font-size="9" text-anchor="middle">origin: said</text>

  <text x="40" y="488" fill="#64748b" font-size="8">the words appear only in the session, read from your own transcript; the night keeps which file and two keyed digests</text>

  <text x="25" y="34" fill="white" font-size="16" font-weight="700">Possible new facts</text>
  <text x="25" y="50" fill="#94a3b8" font-size="9">something you said that memory does not hold yet · measured: 86 % real facts (synthetic), 7 of 7 (one real home)</text>

  <text x="25" y="535" fill="#64748b" font-size="8">HMAC-SHA256 with this install's salt (~/.dreaming/salt) · a line edited or a file removed since the night: the lead is gone</text>
</svg>
